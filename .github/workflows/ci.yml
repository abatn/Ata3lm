# CI für den Knowledge-Agenten: Lint (Ruff) + Tests (pytest, 100 % Line+Branch).
# Quellen: https://docs.astral.sh/ruff/ · https://docs.pytest.org/ · AGENTS.md
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff installieren
        run: pip install ruff==0.16.10
      - name: Ruff check
        run: ruff check .
      - name: Ruff format --check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    # AGENTS.md Guardrail 7: echte Verifikation -> Endpoint-Key als GitHub-Secret.
    # Secret anlegen: Settings -> Secrets and variables -> Actions -> OPENAI_API_KEY
    # (optional OPENAI_BASE_URL=https://integrate.api.nvidia.com/v1).
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt
      - name: Tests + Coverage (Line+Branch, 100 %)
        run: make test
