[pytest]
# Quelle für die Optionen: https://docs.pytest.org/en/stable/reference/customize.html
minversion = 8.0
testpaths = tests
addopts =
    -ra
    --strict-markers
    --cov=fast_write_router
    --cov=approval
    --cov=trust
    --cov=bias_monitor
    --cov-report=term-missing
    # Mindest-Score: 65 % Gesamt-Coverage (gemessen 2026-10-01: 67 %, siehe ergebnisse/ci-setup.md)
    --cov-fail-under=65
markers =
    network: braucht das echte LLM-Endpoint (nicht fuer `make test`)
