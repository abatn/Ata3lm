[pytest]
# Quelle für die Optionen: https://docs.pytest.org/en/stable/reference/customize.html
minversion = 8.0
testpaths = tests
addopts =
    -ra
    --strict-markers
    --cov=data/memory
    --cov=skills
    --cov=ergebnisse/rekursion/solver
    --cov-report=term-missing
    # Mindest-Score: 100 % Gesamt-Coverage (Statement-Coverage, .coveragerc)
    --cov-fail-under=100
markers =
    network: braucht das echte LLM-Endpoint (nicht fuer `make test`)
